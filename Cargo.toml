[workspace]
members = [
  "crates/*",
  "apps/*/src-tauri"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Venner Team"]
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]
# Core dependencies - stabilne standardy na rok 2026
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tauri 2.10.2 - Twoja obecna wersja (dojrzały ekosystem)
tauri = { version = "2.10.2", features = [] }
tauri-build = { version = "2.10.2", features = [] }

# Specta v2 RC - do stabilnego 2.0
specta = { version = "2.0.0-rc.22", features = ["tauri"] }
specta-typescript = "0.0.9"

# Async & Error handling - zaktualizowane do najnowszych stabilnych wydań
tokio = { version = "1.40", features = ["full"] }
thiserror = "2.0" # Standard dla projektów Rust 2024+
