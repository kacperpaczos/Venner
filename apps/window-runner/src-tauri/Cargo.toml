[package]
name = "window-runner"
version = "0.1.0"
description = "Venner native-window replacement runner"
authors = ["Venner Team"]
edition.workspace = true

[lib]
name = "window_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = "2"
tauri-plugin-log = { workspace = true }
log = "0.4"
venner_core = { path = "../../../crates/venner_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
